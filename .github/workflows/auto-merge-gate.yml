name: Auto-merge Gate

on:
  workflow_run:
    workflows:
      - "Test Frontend"
      - "Test Backend"
    types: [completed]

  pull_request:
    types: [opened, synchronize]

permissions:
  checks: read
  statuses: write
  actions: read

concurrency:
  group: auto-merge-gate-${{ github.event.pull_request.number || (github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate auto-merge readiness
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0])
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load config and evaluate checks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Determine PR context
            let prNumber, headSha;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              headSha = context.payload.pull_request.head.sha;
            } else {
              // workflow_run event
              const prs = context.payload.workflow_run.pull_requests;
              if (!prs || prs.length === 0) {
                console.log('No PR associated with this workflow run, skipping');
                return;
              }
              prNumber = prs[0].number;
              headSha = context.payload.workflow_run.head_sha;
            }

            console.log(`Evaluating PR #${prNumber}, commit ${headSha}`);

            // Load config
            const configPath = '.github/auto-merge-config.json';
            let config;
            try {
              const configContent = fs.readFileSync(configPath, 'utf8');
              config = JSON.parse(configContent).workflows;
            } catch (error) {
              throw new Error(`Failed to load config from ${configPath}: ${error.message}`);
            }

            // Get all check runs for this commit (with pagination)
            let allCheckRuns = [];
            try {
              for await (const response of github.paginate.iterator(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100
                }
              )) {
                allCheckRuns.push(...response.data);
              }
            } catch (error) {
              throw new Error(`Failed to fetch check runs: ${error.message}`);
            }

            // Get all workflow runs for this commit (with pagination)
            let allWorkflowRuns = [];
            try {
              for await (const response of github.paginate.iterator(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  per_page: 100
                }
              )) {
                allWorkflowRuns.push(...response.data);
              }
            } catch (error) {
              throw new Error(`Failed to fetch workflow runs: ${error.message}`);
            }

            const runningWorkflows = new Set(
              allWorkflowRuns.map(wr => wr.name)
            );

            console.log('Running workflows:', [...runningWorkflows]);
            console.log('Check runs found:', allCheckRuns.map(c => `${c.name}: ${c.status}/${c.conclusion}`));

            // Evaluate each workflow's required checks
            let hasInProgress = false;
            const failedChecks = [];
            const passedChecks = [];
            const skippedWorkflows = [];

            for (const [workflowName, workflowConfig] of Object.entries(config)) {
              if (!workflowConfig.required_checks) continue;

              // Check if this workflow ran at all
              if (!runningWorkflows.has(workflowName)) {
                console.log(`Workflow "${workflowName}" did not run (path filtering), treating as passed`);
                skippedWorkflows.push(workflowName);
                continue;
              }

              // Evaluate each required check pattern
              for (const pattern of workflowConfig.required_checks) {
                const regex = new RegExp(`^${pattern}$`);
                const matchingChecks = allCheckRuns.filter(c => regex.test(c.name));

                if (matchingChecks.length === 0) {
                  // Check doesn't exist yet - might still be starting
                  console.log(`Check pattern "${pattern}" not found yet`);
                  hasInProgress = true;
                  continue;
                }

                for (const check of matchingChecks) {
                  if (check.status !== 'completed') {
                    console.log(`Check "${check.name}" is still ${check.status}`);
                    hasInProgress = true;
                    continue;
                  }

                  if (check.conclusion === 'success' || check.conclusion === 'skipped' || check.conclusion === 'neutral') {
                    console.log(`Check "${check.name}" passed (${check.conclusion})`);
                    passedChecks.push(check.name);
                  } else {
                    console.log(`Check "${check.name}" failed (${check.conclusion})`);
                    failedChecks.push(check.name);
                  }
                }
              }
            }

            // Determine final status
            let state, description;
            if (failedChecks.length > 0) {
              state = 'failure';
              description = `Failed: ${failedChecks.slice(0, 3).join(', ')}${failedChecks.length > 3 ? '...' : ''}`;
            } else if (hasInProgress) {
              state = 'pending';
              description = 'Waiting for checks to complete';
            } else {
              state = 'success';
              const summary = [];
              if (passedChecks.length > 0) summary.push(`${passedChecks.length} passed`);
              if (skippedWorkflows.length > 0) summary.push(`${skippedWorkflows.length} workflows skipped`);
              description = summary.length > 0 ? summary.join(', ') : 'All checks passed';
            }

            console.log(`Setting status: ${state} - ${description}`);

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: state,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                description: description.substring(0, 140),
                context: 'auto-merge-gate'
              });
            } catch (error) {
              throw new Error(`Failed to set commit status: ${error.message}`);
            }
