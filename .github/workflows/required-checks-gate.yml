name: Required Checks Gate

on:
  workflow_run:
    workflows:
      - "Test Frontend"
      - "Test Backend"
    types: [completed]

  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  checks: read
  statuses: write
  actions: read

concurrency:
  group: required-checks-${{ github.event.pull_request.number || (github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate required checks
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0])
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Load config and evaluate checks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const script = require('./.github/scripts/evaluate-required-checks.js');
            await script({ github, context, fs });
